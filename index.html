<style>
:root{--navy:#f6ead2;--black:#4a3526;--pink:#d9777f;--purple:#8fb4d8;--card:#fff6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.fl{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.5}

h1{font-size:30px;margin:6px 0 2px;background:linear-gradient(90deg,var(--pink),var(--purple),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1s}

.screen{animation:in .8s both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.card{background:var(--card);border:2px solid var(--purple);border-radius:22px;padding:18px;margin:14px 0;cursor:pointer;transition:.3s;box-shadow:0 8px 30px #0008}

.card.div .em{animation:shake 2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.card b.t{display:block;font-size:20px;margin:6px 0;color:var(--pink)}

.big{font-size:64px;animation:bob 2.4s infinite}
.cursor:after{content:"|";animation:blink 1s infinite}

.coin{font-size:44px;display:inline-block;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.conf{position:fixed;top:-20px;font-size:24px;animation:fall 5s linear forwards;pointer-events:none;z-index:9}

.bar{height:22px;border-radius:99px;background:var(--black);overflow:hidden;border:2px solid var(--purple);margin:6px 0 12px;text-align:left}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width 3s}
.pct{font-size:54px;font-weight:bold;color:var(--pink);animation:pop 1s}
.cert{background:#fff;color:var(--navy);border:6px double var(--purple);border-radius:16px;padding:18px;margin:14px 0;animation:in 1s}

.slot{font-size:20px;font-weight:bold;color:var(--pink);min-height:70px;padding:12px;border:3px dashed var(--purple);border-radius:16px;margin:10px 0;display:flex;align-items:center;justify-content:center}
.line{font-size:20px;margin:14px 0;animation:in .8s both}
.row{display:flex;justify-content:space-between;text-align:left;padding:8px 0;border-bottom:1px dashed var(--purple);animation:in .8s both}
@keyframes out{to{opacity:0;transform:translateY(-14px) scale(.9)}}
#kc{min-height:100px}
.kl{background:#fff;color:var(--black);border-radius:14px;padding:12px;margin:10px 0;text-align:left;font-size:16px;line-height:1.5;animation:in .8s both}
.cb{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;text-align:left;font-size:15px;line-height:1.4;animation:in .6s both}.cb small{display:block;font-weight:bold;opacity:.7;margin-bottom:2px}.cb.a{background:#fff;color:var(--black);margin-right:auto}.cb.m{background:linear-gradient(90deg,var(--pink),var(--purple));margin-left:auto}
.note{font-size:11px;opacity:.6;margin-top:24px}

#md{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc{position:relative;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--card);border:3px solid var(--pink);border-radius:26px;padding:24px 20px 20px;text-align:left;box-shadow:0 20px 60px #000;animation:pop .45s both}
.mx{position:absolute;top:10px;right:12px;width:36px;height:36px;padding:0;margin:0;border-radius:50%;font-size:16px;animation:none}
.mh{text-align:center;margin-bottom:14px}
.mh .e{font-size:52px}
.mh h3{margin:6px 0 2px;font-size:22px;color:var(--pink)}
.mh .bd{display:inline-block;font-size:12px;font-weight:bold;border-radius:99px;padding:3px 12px;background:var(--purple);margin-right:6px}
.mh small{opacity:.7;font-size:12px}
.ms{background:var(--black);border-radius:16px;padding:12px 14px;margin:10px 0}
.ms .k{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ms .v{font-size:17px;font-weight:bold;word-break:break-word}
.ms .v.big2{font-size:26px;color:var(--pink)}
.mbar{height:12px;border-radius:99px;background:#fff2;overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg .ms{margin:0}
.ml{margin:4px 0 0;padding-left:20px;font-weight:normal;font-size:15px;line-height:1.6}
.mq{background:#fff;color:var(--black);border-radius:16px;padding:12px 14px;margin:10px 0 0;font-size:15px;line-height:1.5}
.mq small{display:block;color:var(--purple);font-weight:bold;margin-bottom:2px}

@keyframes pulse{0%,100%{transform:scale(1)}30%{transform:scale(1.08,.93)}50%{transform:scale(.96,1.05)}70%{transform:scale(1.03,.98)}}

.card .em{animation:heart 1.8s ease-in-out infinite}

.pct{text-shadow:0 0 24px #a78bfaaa}

.bubble,.kl,.mq,.line,#ms,.cb{background:linear-gradient(145deg,#ffffff24,#ffffff0a)!important;color:#fff!important;border:1px solid #a78bfa66;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 28px #0006,inset 0 1px 0 #ffffff30}

.bubble small,.mq small,.cb small{color:var(--pink)}

.gav{display:inline-block;transform-origin:80% 80%;animation:slam 1.4s ease-in-out infinite!important}
@keyframes slamS{0%{transform:scale(3) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}

.card{animation:bi .6s backwards}
.screen>.card:nth-of-type(2){animation-delay:.15s}
h2{animation:bi .6s backwards}
button{position:relative;overflow:hidden}

.price{background:linear-gradient(90deg,#a78bfa,#ff8fb8,#a78bfa);background-size:200% auto;animation:shine 3s linear infinite}
.row{animation:bi .5s both;border-bottom:1px dashed #a78bfa66}
.coin{animation:spin 1.2s ease-in-out infinite,hop 1.2s ease-in-out infinite}

@keyframes shk{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.03)}}

body:before{content:'';position:fixed;inset:0;z-index:-1;background-image:radial-gradient(#a78bfa24 1.5px,transparent 1.5px);background-size:28px 28px;pointer-events:none}
