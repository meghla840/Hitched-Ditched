<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitched &amp; Ditched</title>
<style>
:root{--navy:#0d1233;--black:#07081a;--pink:#ff5fa2;--purple:#8b5cf6;--card:#171b4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2a1a66 0,var(--navy) 45%,var(--black) 100%);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.5}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg)}}
main{position:relative;max-width:480px;margin:0 auto;padding:14px 16px 40px;text-align:center}
#tick{background:var(--pink);color:var(--black);font-weight:bold;font-size:13px;border-radius:99px;padding:6px 12px;margin-bottom:10px}
h1{font-size:30px;margin:6px 0 2px;background:linear-gradient(90deg,var(--pink),var(--purple),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1s}
.sub{opacity:.9;margin-bottom:12px}
#score{display:inline-block;border:2px solid var(--purple);border-radius:99px;padding:5px 14px;font-size:13px;margin-bottom:6px}
.screen{animation:in .8s both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.card{background:var(--card);border:2px solid var(--purple);border-radius:22px;padding:18px;margin:14px 0;cursor:pointer;transition:.3s;box-shadow:0 8px 30px #0008}
.card:hover,.card:active{transform:scale(1.03);border-color:var(--pink)}
.card .em{font-size:52px;display:block;animation:bob 2.4s ease-in-out infinite}
.card.div .em{animation:shake 2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.card b.t{display:block;font-size:20px;margin:6px 0;color:var(--pink)}
.price{display:inline-block;background:var(--pink);color:var(--black);font-weight:bold;border-radius:99px;padding:4px 14px;margin-top:8px}
button{font:inherit;font-weight:bold;border:0;border-radius:99px;padding:13px 24px;margin:8px 4px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--purple));cursor:pointer;animation:pulse 2.2s infinite}
button.ghost{background:none;border:2px solid var(--purple);animation:none}
button.sm{padding:6px 16px;margin:0 6px;font-size:20px;animation:none}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 18px var(--pink)}}
input{font:inherit;width:100%;padding:12px 16px;margin:6px 0;border-radius:99px;border:2px solid var(--purple);background:var(--black);color:#fff;text-align:center}
.bubble{background:#fff;color:var(--black);border-radius:20px;padding:16px;margin:16px 0;text-align:left;position:relative;font-size:16px;line-height:1.5}
.bubble small{display:block;color:var(--purple);font-weight:bold;margin-bottom:4px}
.bubble:after{content:"";position:absolute;top:-10px;left:30px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.big{font-size:64px;animation:bob 2.4s infinite}
.cursor:after{content:"|";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.coin{font-size:44px;display:inline-block;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.conf{position:fixed;top:-20px;font-size:24px;animation:fall 5s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.bar{height:22px;border-radius:99px;background:var(--black);overflow:hidden;border:2px solid var(--purple);margin:6px 0 12px;text-align:left}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width 3s}
.pct{font-size:54px;font-weight:bold;color:var(--pink);animation:pop 1s}
.cert{background:#fff;color:var(--navy);border:6px double var(--purple);border-radius:16px;padding:18px;margin:14px 0;animation:in 1s}
.cert h3{margin:4px 0;color:var(--purple)}
.stamp{display:inline-block;border:3px solid var(--pink);color:var(--pink);font-weight:bold;padding:4px 12px;border-radius:8px;transform:rotate(-10deg);animation:pop 1.2s .8s both}
.slot{font-size:20px;font-weight:bold;color:var(--pink);min-height:70px;padding:12px;border:3px dashed var(--purple);border-radius:16px;margin:10px 0;display:flex;align-items:center;justify-content:center}
.line{font-size:20px;margin:14px 0;animation:in .8s both}
.row{display:flex;justify-content:space-between;text-align:left;padding:8px 0;border-bottom:1px dashed var(--purple);animation:in .8s both}
@keyframes out{to{opacity:0;transform:translateY(-14px) scale(.9)}}
#kc{min-height:100px}
.kl{background:#fff;color:var(--black);border-radius:14px;padding:12px;margin:10px 0;text-align:left;font-size:16px;line-height:1.5;animation:in .8s both}
.cb{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;text-align:left;font-size:15px;line-height:1.4;animation:in .6s both}.cb small{display:block;font-weight:bold;opacity:.7;margin-bottom:2px}.cb.a{background:#fff;color:var(--black);margin-right:auto}.cb.m{background:linear-gradient(90deg,var(--pink),var(--purple));margin-left:auto}
.note{font-size:11px;opacity:.6;margin-top:24px}

#md{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mc{position:relative;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--card);border:3px solid var(--pink);border-radius:26px;padding:24px 20px 20px;text-align:left;box-shadow:0 20px 60px #000;animation:pop .45s both}
.mx{position:absolute;top:10px;right:12px;width:36px;height:36px;padding:0;margin:0;border-radius:50%;font-size:16px;animation:none}
.mh{text-align:center;margin-bottom:14px}
.mh .e{font-size:52px}
.mh h3{margin:6px 0 2px;font-size:22px;color:var(--pink)}
.mh .bd{display:inline-block;font-size:12px;font-weight:bold;border-radius:99px;padding:3px 12px;background:var(--purple);margin-right:6px}
.mh small{opacity:.7;font-size:12px}
.ms{background:var(--black);border-radius:16px;padding:12px 14px;margin:10px 0}
.ms .k{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ms .v{font-size:17px;font-weight:bold;word-break:break-word}
.ms .v.big2{font-size:26px;color:var(--pink)}
.mbar{height:12px;border-radius:99px;background:#fff2;overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg .ms{margin:0}
.ml{margin:4px 0 0;padding-left:20px;font-weight:normal;font-size:15px;line-height:1.6}
.mq{background:#fff;color:var(--black);border-radius:16px;padding:12px 14px;margin:10px 0 0;font-size:15px;line-height:1.5}
.mq small{display:block;color:var(--purple);font-weight:bold;margin-bottom:2px}
</style>
</head>
<body>
<div id="bg"></div>
<main>
<div id="tick">🔔 Live: ...</div>
<h1>💍 Hitched &amp; Ditched 🔨</h1>
<div class="sub">"Jora lagai, jora bhangi — Terms &amp; Conditions apply!"</div>
<div id="score"></div>
<div id="app"></div>
<div class="note">Payment fake, kono taka katbe na 😄</div>
</main>
<script>
const app=document.getElementById('app'),bg=document.getElementById('bg');
const R=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tk=n=>'৳'+n.toLocaleString('en-IN');
let S={a:'',b:'',k:0,plan:null,mode:'',t:0},M=0,D=0;
['💖','💜','💍','🌴','🕊️','✨'].forEach(e=>{for(let k=0;k<3;k++){const s=document.createElement('span');s.className='fl';s.textContent=e;s.style.left=Math.random()*95+'%';s.style.fontSize=(16+Math.random()*20)+'px';s.style.animationDuration=(14+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*20)+'s';bg.appendChild(s)}});
const news=['Ekta jora ekhoni khejur kinte gelo 🌴','Aj shokal theke 17 ta jora hitched holo 💍','Adon Sir ekhon notun case dekhchen ⚖️','Meghla Apu ekta notun biyer shomborkho pathalen 💌','Kazi shaheb chai kheye ready ☕','Ekjon bhai amader 3 bar customer, shotti VIP! 👑','Ekta jora biye kore 5 minute e divorce er jonno ashlo 😂'];
let ni=0;setInterval(()=>document.getElementById('tick').textContent='🔔 Live: '+news[++ni%news.length],6000);
function title(){const t=M+D;return t==0?'Fresh Customer 🧳':t<3?'Regular Customer 🎫':t<5?'Hitch-Ditch Pro 🏅':'Boss Level 👑'}
function sc(){document.getElementById('score').textContent=`💍 Hitched: ${M}  •  🔨 Ditched: ${D}  •  ${title()}`}sc();
function confetti(a){a=a||['💖','🎉','💜','✨','🌴'];for(let i=0;i<30;i++){const c=document.createElement('div');c.className='conf';c.textContent=a[i%a.length];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),8000)}}
function type(id,t,i=0){const el=document.getElementById(id);if(!el)return;el.textContent=t.slice(0,i);if(i<t.length){el.classList.add('cursor');setTimeout(()=>type(id,t,i+1),55)}else el.classList.remove('cursor')}
function cycle(id,arr,ms,done){let i=0;const el=()=>document.getElementById(id);const f=()=>{if(el())el().textContent=arr[i++%arr.length]};f();const h=setInterval(f,ms);setTimeout(()=>{clearInterval(h);done()},ms*arr.length)}
function show(h){app.innerHTML='<div class="screen">'+h+'</div>'}
function seq(lines,id,done){let i=0;const n=()=>{if(i<lines.length){const d=document.createElement('div');d.className='line';d.textContent=lines[i++];document.getElementById(id).appendChild(d);setTimeout(n,3000)}else done()};n()}
const back='<button class="ghost" onclick="home()">⬅ Shuru te fire jai</button>';

function home(){sc();show(`
<div class="card" onclick="names('m')"><span class="em">💍</span><b class="t">Hitch Me Up!</b>Notun jibon, notun khejur, notun jhogra 🥰 Ekhane jora lagano hoy!</div>
<div class="card div" onclick="names('d')"><span class="em">🔨</span><b class="t">Ditch &amp; Dash!</b>Shanti-purno bidai 🌈 Ekhane jora bhanga hoy!</div>`)}

function names(m){S.mode=m;S.k=0;show(`<div class="big">${m=='m'?'👰🤵':'🕊️🕊️'}</div>
<h2>${m=='m'?'Dui jon er nam likho':'Kar kar jora bhangbo? Nam bolo'}</h2>
<input id="n1" placeholder="Tomar nam 😎"><input id="n2" placeholder="${m=='m'?'Jar shathe jibon kaatbe 💕':'Jar shathe bidai nibe 🕊️'}">
<button onclick="go()">Agiye jai 🚀</button>${back}`)}
function go(){S.a=esc(document.getElementById('n1').value.trim()||'Hobu Bor');S.b=esc(document.getElementById('n2').value.trim()||'Hobu Bou');S.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);part({name1:S.a,name2:S.b,status:'Name diyeche'});S.mode=='m'?match():reason()}

function match(){show(`<h2>${S.a} 💞 ${S.b}</h2><p>Jora-Meter chalu hocche...</p><div class="bar"><i id="f"></i></div><p id="ms" style="min-height:48px;font-size:18px"></p>`);
document.getElementById('f').style.transitionDuration='8s';setTimeout(()=>document.getElementById('f').style.width='100%',50);
cycle('ms',['Ras-nokkhottro milano hocche... 🔮','Dujoner pochondo-er list dekha hocche 📝','Dekhchi dujon e chai khete bhalobashe ki na ☕','Wifi password share korte raji ki na check 📶'],2000,()=>{
const p=S.pct=Math.floor(Math.random()*40)+60;part({match_percent:S.pct});
const c=p>90?'Ekdom perfect jora! Ekhoni Kazi shaheb ke dako 😍':p>80?'Khub bhalo mil! Khejur ektu beshi kinle aro bhalo 🌴':p>70?'Beshi bhalo, tobe remote niye ektu jhogra hobei 📺':'Ektu kom, tobe bhalobasha thakle shob thik hoye jay 💖';
show(`<div class="pct">${p}%</div><h3>Jora Match!</h3><p>${c}</p><button onclick="plans()">Biyer dhoron bachi 💍</button>`)})}

const P={khejur:{n:'Khejur Fiesta 🌴',e:'🌴',d:'Kazi shaheb + mishti khejur + chhoto ek ghoroa biye. Shorol, shundor, amader moto!',items:[['Kazi shaheb 🕌',5000],['Khejur er tin 🌴',2000]]},
event:{n:'Royal Jhakanaka 👑',e:'🎉',d:'Kazi shaheb + Registry Lawyer + stage + DJ + alo + "Biyer gaan". Kagoj-potro pakka, dhoom-dham shorgoroom!',items:[['Kazi shaheb 🕌',5000],['Registry Lawyer 📜⚖️',8000],['Event Manager + DJ 🎤',25000]]}};
const sum=p=>p.items.reduce((s,i)=>s+i[1],0);
function plans(){show(`<h2>Kon style e biye korbe? 🥰</h2>${Object.keys(P).map(k=>`<div class="card" onclick="pay('${k}')"><span class="em">${P[k].e}</span><b class="t">${P[k].n}</b>${P[k].d}<br><span class="price">${tk(sum(P[k]))}</span></div>`).join('')}${back}`)}

function pay(k){S.plan=k;const p=P[k];part({plan:p.n});
show(`<div class="big">${p.e}</div><h2>${p.n}</h2><div class="card" style="cursor:default">
${p.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${i[0]}</span><b>${tk(i[1])}</b></div>`).join('')}
<hr style="border-color:var(--purple)"><div>🌴 Extra khejur? (৳50/ta)<br><button class="sm" onclick="kh(-1)">−</button><b id="kc" style="font-size:22px">0</b><button class="sm" onclick="kh(1)">+</button></div><p id="kq" style="font-size:14px;opacity:.9;min-height:22px"></p>
<div style="display:flex;justify-content:space-between;font-size:18px"><b>Mot</b><b id="tt">${tk(sum(p))}</b></div></div>
<button onclick="kobul()">💸 Taka dilam, ebar kobul bolbo!</button>${back}`)}
function kh(d){S.k=Math.max(0,S.k+d);document.getElementById('kc').textContent=S.k;document.getElementById('tt').textContent=tk(sum(P[S.plan])+S.k*50);
document.getElementById('kq').textContent=S.k==0?'':S.k<5?'Khejur ektu kom, mishti-r kosto hobe 😅':S.k<15?'Wah, khejur-premi manush! 😍':'Eto khejur! Ekta bagan e biye hobe ei bar 🌴🌴🌴'}

const kb=['Kazi shaheb: "Hat joro koro, ar shobar shamne bolo: Kobul!" 🕌','Kazi shaheb: "Ei ta ki bolcho? Shashuri kane kom shonen, aro jore!" 📢','Kazi shaheb: "Last chance! Ektu hashi mukhe bolo, camera ache!" 📸😊'];
let seenK=false,seenA=false;
function kline(t){const c=document.getElementById('kc'),o=c.firstChild,put=()=>{c.innerHTML='<div class="kl">'+t+'</div>'};if(o){o.style.animation='out .4s forwards';setTimeout(put,400)}else put()}
function kobul(){S.t=0;const sk=seenK;seenK=true;show(`<h2>Ebar kobul bolo! 🕌</h2><div class="card" style="cursor:default"><span class="em">🕌</span><b class="t">Kazi Shaheb</b><div id="kc"></div></div><div id="kb"></div>`);
const strip=x=>x.replace(/^Kazi shaheb: /,'');const lines=(sk?[]:[wl('Nazim Bhai er jonno','Apni korben biye? Ok, thik ache, shuru kori!')]).concat([strip(kb[0])]);let i=0;
const n=()=>{if(i<lines.length){kline(lines[i++]);setTimeout(n,3000)}else document.getElementById('kb').innerHTML='<button id="kbtn" onclick="kt()">🗣️ KOBUL!</button>'};n()}
function kt(){S.t++;confetti(['🎉']);if(S.t<3){kline(kb[S.t].replace(/^Kazi shaheb: /,''));document.getElementById('kbtn').textContent=S.t==1?'🗣️ KOBUL KOBUL!':'🗣️ KOBUL KOBUL KOBUL!!'}else setTimeout(paying,1200)}

const rev=['Shashuri: "Chele ta bhalo, tobe ranna ektu shikhte hobe 🍳"','Shashur: "Ami asholei khejur er jonno ashechi, biye ta bonus 🌴"','Bondhu: "Biriyani ta ektu kom chilo, tai 4 star ⭐⭐⭐⭐"','Khala: "Amar jonno o ekta jora khuje dao to 🥹"','Photographer: "Shobai hashun, ei bar shotti camera on ache 📸"'];
function paying(){const t=sum(P[S.plan])+S.k*50;show(`<div class="coin">🪙</div><h2>${tk(t)} pathano hocche... 💨</h2><p id="ms" style="min-height:48px;font-size:18px"></p>`);
const ev=S.plan=='event';
cycle('ms',ev?['Kazi shaheb panjabi iron kore ready hocchen 🕌👔','Registry Lawyer ekta kolom niye 7 ta ID check korchen 📜🧐','Registry Lawyer: "Shob shoi koro, hat betha hole amar dosh nai!" ✍️','DJ bhai: "Biyer gaan er volume ektu beshi hobe!" 🎧🔊','Event Manager: "Stage er ful gula shob taja, shotti!" 🌸'].concat(['Shashuri bari te khobor gese, shobai kanna kati korchen 😭💖']):['Kazi shaheb bhat khacchen, ektu dara dite hobe 🍚','Khejur gulo ek ek kore bachai hocche, kharap gula Kazi shaheb er 😋🌴','Kazi shaheb: "Khejur ta mishti, tai biye ta o mishti hobe!" 🕌','Shashuri bari te khobor gese, shobai kanna kati korchen 😭💖'],2000,()=>{M++;sc();confetti();
show(`<div class="big">🎊</div><h2>Mubarak ${S.a} &amp; ${S.b}! 🥳</h2>
<div class="cert"><small>OFFICIAL</small><h3>💍 Hitched Certificate 💍</h3><p><b>${S.a}</b> ar <b>${S.b}</b> ekhon officially "Jora" 💞<br>Khejur: ${S.k+3} ta 🌴${ev?'<br>Registry: ✅ Pakka, Lawyer shaheb shoi diyechen 📜':''}</p><span class="stamp">HITCHED ✔</span><p style="font-size:14px">${R(rev)}</p></div>
<div class="bubble"><small>👩‍💼 Meghla, Owner of Hitched &amp; Ditched</small><span id="m"></span></div>
<button class="ghost" onclick="home()">🔁 Shuru te jai</button>`);
const fm='Biye hoye gelo, tai khub khushi! 🥰 Kintu kokhono jodi biye bhangar proyojon hoy, plz amader kachei aisen!';type('m',fm);
save({id:S.id,status:'Complete',type:'Biye',name1:S.a,name2:S.b,match_percent:S.pct,plan:P[S.plan].n,extra_khejur:S.k,total_taka:t,final_message:fm})})}

const why=['Remote niye roj-roj jhogra 📺','Ghumer shomoy naak dakar karone 😴','Ranna e lonka beshi hoye gese 🌶️','Biye er por selfie tola bondho 🤳','Shashuri bari boro beshi shokal shokal ashe 🏠','Biriyani er leg piece ke khabe, ei niye juddho 🍗','Wifi password bhule jawar jonno doshi korano 📶','Ek bar "Tumi to boro bhalo" bolchilam, ekhon dekhi tai noy 😤','Phone e shobshomoy chat, amar dike tak e nei 📱','Pizza er last piece ke khabe, ei niye juddho 🍕','Mojo kine dilo na, ekhon shob shesh 🥤😤','Toggy te niye gelo na, shei dukkho ajo bhulte pari ni 🎢😭','Shudhu "ami ektu shanti chai" 🕊️'];
function reason(){show(`<h2>${S.a} 🔨 ${S.b}</h2><p>Bhangar karon ki? Roulette bolbe! 🎰</p><div class="slot" id="sl">?</div><button id="sp" onclick="spin()">🎰 Ghurao</button>${back}`)}
function spin(){document.getElementById('sp').style.display='none';let i=0;const h=setInterval(()=>document.getElementById('sl').textContent=R(why),450);
setTimeout(()=>{clearInterval(h);S.reason=R(why);part({reason:S.reason});document.getElementById('sl').textContent='Karon: '+S.reason;app.querySelector('.screen').insertAdjacentHTML('beforeend','<button onclick="greet()">Thik ache, agai ➡️</button>')},4000)}

function wl(ex,tail){const n=S.a.trim().toLowerCase();
if(n=='rakib'||n=='nazim')return 'Bhai, apnar jonnoi to wait korchilam! 🤗';
if(n=='oshi')return 'Apu, apnar jonnoi to wait korchilam! 🤗';
return 'Ami to '+ex+' wait korchilam... oh, apni '+S.a+'! '+tail}
function greet(){show(`<div class="big">🧐</div><div id="gl"></div><div id="nx"></div>`);
const first=!seenA;seenA=true;
seq(['Apnakei to khujchi amra! 🔍'].concat(first?['👨‍⚖️ Adon Sir (CEO): "'+wl('Rakib, Oshi Apu eder','Apnar jonno o wait korchilam!')+'"']:[],['Eto late keno ashlen?? Kotodin dhore wait korchi! 😤','Coffee thanda hoye gese, tai notun coffee order dilam ☕','Jak, ekhon ashchen, tai shob maf! 🤗']),'gl',()=>{document.getElementById('nx').innerHTML=`<p>${S.a} ar ${S.b} er jonno shera lawyer:</p>
<div class="card" style="cursor:default"><span class="em">👨‍⚖️</span><b class="t">Adon Sir, CEO &amp; Chief Ditch Officer</b>"Jora jotoi shokto hok, ami shobi bhenge dibo!" ⚖️</div>
<button onclick="call()">📞 Adon Sir ke call dao</button>${back}`})}
function call(){show(`<div class="coin">☎️</div><h2>Adon Sir ke call kora hocche...</h2><p id="ms" style="min-height:48px;font-size:18px"></p>`);
cycle('ms',['Ring ring... "Hello, Adon bolchi!" 📱','"Biye bhangar kotha? Ekdom ready!" 😎','Adon Sir kala kot pore nilen 🕶️','"Mamla ta shundor, ekhoni kaj shuru!" ⚖️'],2000,dplans)}

function blame(){const a=Math.floor(Math.random()*70)+15,b=100-a;S.ba=a;S.bb=b;part({blame_name1_percent:a,blame_name2_percent:b});show(`<h2>🔎 Dosh-Meter</h2><p>Kar dosh beshi? Adon Sir er rai:</p>
<div style="text-align:left">${S.a}: <b>${a}%</b></div><div class="bar"><i id="b1"></i></div><div style="text-align:left">${S.b}: <b>${b}%</b></div><div class="bar"><i id="b2"></i></div>
<p style="font-size:18px">${a==b?'Dujon e shoman!':a>b?S.a+' er dosh beshi 🙈':S.b+' er dosh beshi 🙈'} Tobe Adon Sir bolen, "Dosh dewa jhogra er mool noy, ami ektu ghumabo" 😴</p><button onclick="prop()">Shompotti bhag ➡️</button>`);
['b1','b2'].forEach((id,i)=>{document.getElementById(id).style.transitionDuration='3s';setTimeout(()=>document.getElementById(id).style.width=(i?b:a)+'%',100)})}

const items=['📺 Remote','📶 Wifi password','🍗 Biriyani er leg piece','🎬 Netflix account','🐈 Biral ta','🤳 Shob selfie','🛋️ Shofa-r bhalo kona','🌴 Ghorer khejur'];
function prop(){show(`<h2>⚖️ Shompotti Bhag-Batwara</h2><div id="pl"></div><div id="pn"></div>`);S.props=[];let i=0;
const n=()=>{if(i<items.length){const w=Math.random()<.5?S.a:S.b;S.props.push(items[i]+' -> '+w);document.getElementById('pl').insertAdjacentHTML('beforeend',`<div class="row"><span>${items[i++]}</span><b>➡️ ${w}</b></div>`);setTimeout(n,1500)}else{document.getElementById('pn').innerHTML='<button onclick="mukti()">Final Mukti ➡️</button>'}};n()}

function mukti(){D++;sc();confetti(['🕊️','⚖️','🌸','✨','💜']);
show(`<div class="big">🕊️</div><h2>Mukti! Ditched hoye gele! 🎉</h2>
<div class="cert"><small>OFFICIAL</small><h3>⚖️ Ditched Certificate ⚖️</h3><p><b>${S.a}</b> ar <b>${S.b}</b> ekhon theke "Free Bird" 🕊️</p><br>Package: ${DP[S.dp].n}<br><span class="stamp">DITCHED ✔</span></div>
<div class="bubble"><small>👩‍💼 Meghla, Owner of Hitched &amp; Ditched</small><span id="m"></span></div>
<button onclick="boss()">💼 Boss-der shesh kotha</button><button onclick="mcall()">📞 Meghla Apu ke call dao</button><button class="ghost" onclick="home()">🔁 Shuru te jai</button>`);
const fd='Kono somossa nei! 😊 Biye ki ekta kore thakle hobe naki? Ekta bhenge geche, ekhon arekta dibo. Call korun amader Meghla ke, se apnar biyer bebosta kore dibe!';type('m',fd);
save({id:S.id,status:'Complete',type:'Divorce',name1:S.a,name2:S.b,plan:DP[S.dp].n,tissue_count:S.tiss||0,total_taka:S.tt,reason:S.reason,blame_name1_percent:S.ba,blame_name2_percent:S.bb,property_split:(S.props||[]).join(' | '),final_message:fd})}
function mcall(){show(`<div class="coin">☎️</div><h2>Meghla Apu ke call kora hocche...</h2><p id="ms" style="min-height:48px;font-size:18px"></p>`);
cycle('ms',['Meghla Apu: "Hello! Notun biye? Ekdom!" 💖','"Pattor list ta ready kori" 📝','"Khejur ar Kazi dui-i ready" 🌴','"Ei bar khub bhalo jora khujbo!" 🥰'],2000,()=>names('m'))}

const DP={quick:{n:'Quick Ditch 🏃',e:'🏃',t:['Ex ke ekbar mukhe "tumi bhalo theko" bolte hobe (mone mone jai bolun 😅)','Tata bolar shomoy ekta hashi mukhe rakhte hobe 😄','Adon Sir er pocket-size list theke ekta comedy movie dekhte hobe 🎬','Coffee ta nijer, Adon Sir er na ☕'],d:'Chup-chap bidai, kono drama nai. Shudhu shoi, tata, ar Adon Sir er pocket-size comedy movie list 🎬',p:5000},
drama:{n:'Drama Queen/King Ditch 🎭',e:'🎭',t:['Jhogra e joto drama, tato popcorn lagbe 🍿 (Adon Sir er jonno o)','Adon Sir ke majhe majhe "Wah Wah" bolte hobe 👏','Movie cholar shomoy phone off, noile Adon Sir pause dibe ⏸️','Ex er photo 7 din er moddhe delete korte hobe 🗑️','Pizza er last piece Adon Sir er 🍕'],d:'Full filmy jhogra, Dosh-Meter shoho. Adon Sir popcorn niye shob shunben, tarpor ekta funny movie free dekhaben 🍿🎬',p:12000},
vip:{n:'Free Bird VIP 🕊️👑',e:'👑',t:['Adon Sir court e jaben, tumi shudhu shunbe ar kanbe 😭','Hot coffee ar biriyani plate shob shomoy pashe thakbe ☕🍛','Adon Sir er shathe comedy movie night: tumi hashte paro ki na competition 😂','Adon Sir ke "Boss" bole dakte hobe, "Sir" noy 😎','Ex er shathe dekha hole "Ki khobor?" bole hashi dite hobe 😁'],d:'Adon Sir nijei court e jaben. Sathe tissue box, hot coffee, ek plate biriyani, ar comedy movie night Adon Sir er sathe!',p:25000}};
const DT=['Package er shathe Adon Sir nijer collection theke ekta comedy movie provide korben 🎬 (popcorn extra, hasha free 😂)','Coffee thanda hote dewa jabe na ☕','Ex ke mukhe "tumi bhalo theko" bolte hobe (mone mone jai bolun 😅)','Pizza er last piece Adon Sir er 🍕','Movie cholar shomoy phone dekha cholbe na, noile Adon Sir pause dibe ⏸️','Adon Sir ke "Sir" bole dakte hobe, "Bhai" noy 😎'];
function dplans(){show(`<h2>💸 Adon Sir er Fee Package</h2><p>Adon Sir bolen: "Fee dile mamla, na dile... shudhu ekta coffee ar ekta lomba lecture!" ☕😂</p>${Object.keys(DP).map(k=>`<div class="card" onclick="dpay('${k}')"><span class="em">${DP[k].e}</span><b class="t">${DP[k].n}</b>${DP[k].d}<br><span class="price">${tk(DP[k].p)}</span></div>`).join('')}${back}`)}
function dpay(k){S.dp=k;S.tiss=0;const p=DP[k];part({plan:p.n});show(`<div class="big">${p.e}</div><h2>${p.n}</h2><div class="card" style="cursor:default;text-align:left">
<div style="display:flex;justify-content:space-between"><span>Adon Sir er fee ⚖️</span><b>${tk(p.p)}</b></div><hr style="border-color:var(--purple)">
<div style="text-align:center">🤧 Extra tissue box? (৳30/ta)<br><button class="sm" onclick="ts(-1)">−</button><b id="tc" style="font-size:22px">0</b><button class="sm" onclick="ts(1)">+</button></div><p id="tq" style="text-align:center;font-size:14px;min-height:22px"></p>
<div style="display:flex;justify-content:space-between;font-size:18px"><b>Mot</b><b id="dt">${tk(p.p)}</b></div></div>
<div class="card" style="cursor:default;text-align:left;font-size:14px"><b class="t">📜 Adon Sir er Cute Shortto</b>${p.t.map((x,i)=>`<div style="padding:4px 0">${i+1}. ${x}</div>`).join('')}</div>
<button onclick="dpaying()">✅ Shob shortto mene taka dilam</button>${back}`)}
function ts(d){S.tiss=Math.max(0,S.tiss+d);document.getElementById('tc').textContent=S.tiss;document.getElementById('dt').textContent=tk(DP[S.dp].p+S.tiss*30);document.getElementById('tq').textContent=S.tiss==0?'':S.tiss<4?'Chokh ektu bhije gese? Thik ache 🥹':'Eto tissue! Mone hoy Adon Sir o movie dekhe kede feleche 😭'}
function dpaying(){S.tt=DP[S.dp].p+S.tiss*30;show(`<div class="coin">🪙</div><h2>${tk(S.tt)} Adon Sir er pocket e... 💨</h2><p id="ms" style="min-height:48px;font-size:18px"></p>`);
cycle('ms',['Adon Sir taka gunchen... ek, dui, tin... ar ekta noton extra? 🤑','Adon Sir: "Shundor! Ebar mamla shuru kori, kolom ready!" ⚖️','Adon Sir comedy movie er list ber korchen: "Ei ta dekho, hasbe!" 🎬','Adon Sir coffee nilen: "Coffee thanda hoye gese, tobu kaj hobe!" ☕'],2000,blame)}

function boss(){const t=S.tt||0,h=Math.round(t/2);show(`<h2>💼 Boss-der Shesh Kotha</h2><p style="opacity:.8;font-size:14px">Adon Sir (CEO) &amp; Meghla Apu (Owner), office er pichone...</p><div id="ch"></div><div id="bn"></div>`);
const L=[['M','Adon Bhaiya, ei ditch theke '+tk(t)+' ashechhe. Ebar hisab bujhe nin! 💰'],['A','Meghla Apu, ami to CEO! Mamla ami-i lorlam, tai 70% amar! 😎'],['M','Adon Bhaiya, ami Owner! Office er wifi, coffee, ar khejur ke kine? 70% amar! 😤'],['A','Meghla Apu, ami to comedy movie o provide korlam, oi kharcha ta apni dhorben na? 🎬'],['M','Oi movie to apni amar Netflix e dekhechen, Adon Bhaiya! 📺'],['A','Tahole 60-40 kori, Meghla Apu? Ami 60? 🥺'],['M','Na, Adon Bhaiya! 50-50, noile office er coffee machine bondho ☕🚫'],['A','Thik ache Apu, 50-50. Kintu coffee machine ta bondho korben na, pls 🥺'],['M','Deal! Apni '+tk(h)+' nin, ami '+tk(t-h)+' nebo. Ar shunun, notun customer ashche, biye korbe 💍'],['A','Biye? Tahole ami ekhoni Kazi shaheb ke phone korchi, Apu 😂📞']];let i=0;
const n=()=>{if(i<L.length){const [w,x]=L[i++];document.getElementById('ch').insertAdjacentHTML('beforeend',`<div class="cb ${w=='A'?'a':'m'}"><small>${w=='A'?'Adon Sir (CEO)':'Meghla Apu (Owner)'}</small>${x}</div>`);setTimeout(n,2800)}else document.getElementById('bn').innerHTML=`<div class="card" style="cursor:default"><b class="t">🤝 Deal Done!</b>Adon Sir: <b>${tk(h)}</b> • Meghla Apu: <b>${tk(t-h)}</b></div><button onclick="mcall()">📞 Meghla Apu ke call dao</button><button class="ghost" onclick="home()">🔁 Shuru te jai</button>`};n()}
let DB=null;
const COLS=['time','type','name1','name2','match_percent','plan','extra_khejur','tissue_count','total_taka','reason','blame_name1_percent','blame_name2_percent','property_split','final_message'];
const SHEET_URL='https://script.google.com/macros/s/AKfycbxV9ab5HQ_iYqhVXi9-Al-oUugN-wH6LFTb72KS-ayaLRYi7Vp7J4CWB1UCfYpWdlH4CQ/exec';
function part(o){save(Object.assign({id:S.id,type:S.mode=='m'?'Biye':'Divorce'},o))}
async function save(rec){if(!SHEET_URL.startsWith('http'))return;rec.time=new Date().toISOString();try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)})}catch(e){}}
const SECRET='#/team-only-9x';
let _c=0,_t,_ALL=[],_TAB='all',_KEY='';
document.querySelector('h1').addEventListener('click',()=>{_c++;clearTimeout(_t);_t=setTimeout(()=>_c=0,2000);if(_c>=7){_c=0;location.hash=SECRET}});
function route(){if(location.hash===SECRET)admin()}
addEventListener('hashchange',route);
async function admin(){show(`<h2>🔐 Team Dashboard</h2><input id="pk" type="password" placeholder="Passcode"><button onclick="loadD()">Kholo</button><button class="ghost" onclick="location.hash='';home()">⬅ Fire jai</button>`)}
async function loadD(){
  const k=(document.getElementById('pk')||{}).value||_KEY;_KEY=k;
  show('<h2>Data ana hocche... ⏳</h2>');
  try{
    const r=await fetch(SHEET_URL+'?key='+encodeURIComponent(k)+'&t='+Date.now());
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(_){throw new Error('Apps Script JSON dey nai. Deploy e "Who has access: Anyone" ar "New version" deya hoyeche ki check koro.')}
    if(!j.ok){show('<h2>❌ Passcode thik na</h2><button onclick="admin()">Abar chesta</button>');return}
    _ALL=j.rows.filter(x=>x.type).sort((a,b)=>String(b.time).localeCompare(String(a.time)));
    _TAB='all';draw();
  }catch(e){
    show('<h2>Data load hoy nai 😔</h2><p style="font-size:13px;opacity:.8">'+esc(e.message||e)+'</p><button onclick="admin()">Abar chesta</button><button class="ghost" onclick="location.hash=\'\';home()">⬅ Fire jai</button>');
  }
}
function stat(r){return r.status=='Complete'?'<span style="font-size:11px;background:#16a34a;border-radius:99px;padding:2px 8px">✅ Complete</span>':r.status?'<span style="font-size:11px;background:#d97706;border-radius:99px;padding:2px 8px">⏳ Shesh kore ni</span>':''}
function tab(t){_TAB=t;draw()}
function draw(){closeD();
  const m=_ALL.filter(x=>x.type=='Biye').length,d=_ALL.filter(x=>x.type=='Divorce').length;
  const rows=_TAB=='all'?_ALL:_ALL.filter(x=>x.type==(_TAB=='biye'?'Biye':'Divorce'));
  const lab={match_percent:'Match %',plan:'Plan',extra_khejur:'Extra khejur',tissue_count:'Extra tissue',total_taka:'Mot taka',reason:'Jhogra er karon',blame_name1_percent:'Dosh (prothom jon) %',blame_name2_percent:'Dosh (dwitiyo jon) %',property_split:'Shompotti bhag',final_message:'Final message'};
  const tb=(id,txt)=>`<button class="${_TAB==id?'':'ghost'}" onclick="tab('${id}')">${txt}</button>`;
  show(`<h2>📊 Team Dashboard</h2><p>💍 Biye: <b>${m}</b> • 🔨 Divorce: <b>${d}</b></p>`+
   tb('all','Shob ('+_ALL.length+')')+tb('biye','💍 Biye')+tb('divorce','🔨 Divorce')+
   `<button class="ghost" onclick="loadD()">🔄 Refresh</button><button class="ghost" onclick="location.hash='';home()">⬅ Bahire jai</button>`+
   (rows.length?rows.map(r=>`<div class="card" style="text-align:left;font-size:14px" onclick="openD(${_ALL.indexOf(r)})"><b style="font-size:17px;color:var(--pink)">${r.type=='Biye'?'💍':'🔨'} ${esc(r.name1||'')} &amp; ${esc(r.name2||'')}</b><br><small style="opacity:.7">${esc(r.time?new Date(r.time).toLocaleString():'')}</small> ${stat(r)}<br>`+
   Object.keys(lab).filter(c=>r[c]!==''&&r[c]!==undefined&&r[c]!==null).map(c=>`<b>${lab[c]}:</b> ${esc(r[c])}`).join('<br>')+`<div style="margin-top:8px;font-size:12px;color:var(--pink)">👆 Click kore puro details dekho</div></div>`).join(''):'<p>Ekhono kono data nai 🌱</p>'));
}

function closeD(){const m=document.getElementById('md');if(m)m.remove()}
addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
function openD(i){
  const r=_ALL[i];if(!r)return;closeD();
  const isB=r.type=='Biye',has=v=>v!==''&&v!==undefined&&v!==null;
  const money=v=>{const n=Number(v);return isNaN(n)?esc(v):tk(n)};
  const box=(k,v,cls)=>has(v)?`<div class="ms"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`:'';
  let b='';
  if(isB){
    const pc=Math.max(0,Math.min(100,Number(r.match_percent)||0));
    if(has(r.match_percent))b+=`<div class="ms"><div class="k">💞 Jora-Meter Match</div><div class="v big2">${esc(r.match_percent)}%</div><div class="mbar"><i style="width:${pc}%"></i></div></div>`;
    b+=`<div class="mg">${box('📦 Plan',esc(r.plan))}${box('🌴 Extra khejur',esc(r.extra_khejur))}</div>`;
    b+=box('💰 Mot taka',has(r.total_taka)?money(r.total_taka):'','big2');
  }else{
    b+=box('🎰 Jhogra er karon',esc(r.reason));
    if(has(r.blame_name1_percent)||has(r.blame_name2_percent)){
      const a=Number(r.blame_name1_percent)||0,c=Number(r.blame_name2_percent)||0;
      b+=`<div class="ms"><div class="k">🔎 Dosh-Meter (Adon Sir er rai)</div>
      <div class="v" style="font-size:15px">${esc(r.name1||'Prothom jon')}: <span style="color:var(--pink)">${a}%</span></div><div class="mbar"><i style="width:${a}%"></i></div>
      <div class="v" style="font-size:15px;margin-top:8px">${esc(r.name2||'Dwitiyo jon')}: <span style="color:var(--pink)">${c}%</span></div><div class="mbar"><i style="width:${c}%"></i></div></div>`;
    }
    b+=`<div class="mg">${box('📦 Package',esc(r.plan))}${box('🤧 Extra tissue',esc(r.tissue_count))}</div>`;
    b+=box('💰 Mot taka',has(r.total_taka)?money(r.total_taka):'','big2');
    if(has(r.property_split)){
      const items=String(r.property_split).split(' | ').filter(Boolean);
      b+=`<div class="ms"><div class="k">⚖️ Shompotti bhag-batwara</div><ul class="ml">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
    }
  }
  if(has(r.final_message))b+=`<div class="mq"><small>👩‍💼 Meghla, Owner</small>${esc(r.final_message)}</div>`;
  const d=document.createElement('div');d.id='md';
  d.onclick=e=>{if(e.target===d)closeD()};
  d.innerHTML=`<div class="mc"><button class="mx" onclick="closeD()">✕</button>
   <div class="mh"><div class="e">${isB?'💍':'🕊️'}</div><h3>${esc(r.name1||'')} &amp; ${esc(r.name2||'')}</h3>
   <span class="bd">${isB?'Hitched':'Ditched'}</span>${stat(r)}<br><small>${esc(r.time?new Date(r.time).toLocaleString():'')}</small></div>${b}
   <div style="text-align:center"><button class="ghost" onclick="closeD()">Bondho koro</button></div></div>`;
  document.body.appendChild(d);
}
home();route();
</script>
